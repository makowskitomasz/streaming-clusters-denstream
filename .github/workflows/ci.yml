name: CI

on:
  push:
    branches: ["*"]
  pull_request:
    branches: ["*"]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python (3.12)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Sync dependencies (with dev group)
        run: make dev-sync

      - name: Lint
        run: make lint

      - name: Run Tests (Coverage)
        run: make coverage

      - name: Build Backend Docker image
        run: DOCKER_TAG=ci make build-backend

      - name: Build Frontend Docker image
        run: DOCKER_TAG=ci make build-frontend
